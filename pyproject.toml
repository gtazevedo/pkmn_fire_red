[project]
name = "pkmn-fire-red"
version = "0.1.0"
description = ""
authors = [
    {name = "Guilherme",email = "44090037+gtazevedo@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "gymnasium (>=1.3.0,<2.0.0)",
    "stable-baselines3 (>=2.9.0,<3.0.0)",
    "sb3-contrib (>=2.9.0,<3.0.0)",
    "mlflow (>=3.15.2,<4.0.0)",
    "stable-retro (>=1.0.1,<2.0.0)",
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "pygame (>=2.6.1,<3.0.0)",
    "anyio (<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
